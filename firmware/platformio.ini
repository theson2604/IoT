[platformio]
default_envs = sensor_node, collector_node

[env]
platform = espressif32@6.12.0
board = yolo_uno
framework = arduino
monitor_speed = 115200
build_flags = -DARDUINO_USB_CDC_ON_BOOT=1

[env:sensor_node]
build_src_filter = -<*> +<sensor/main.cpp>
build_flags = ${env.build_flags} -DNODE_ROLE_SENSOR

[env:collector_node]
build_src_filter = -<*> +<collector/main.cpp>
build_flags = ${env.build_flags} -DNODE_ROLE_COLLECTOR
lib_deps =
    knolleary/PubSubClient@2.8
    bblanchon/ArduinoJson@6.21.5

; Legacy Modbus/Waveshare: not part of current MVP.
[env:yolo_uno]
build_src_filter = -<*> +<legacy/main.cpp>
